<div class="reader-controls">
  <label><span class="chapter-label">{{ locale.translate('Chapter') }}</span><span class="select-wrap"><select [ngModel]="chapter().number" (ngModelChange)="close();chapterChange.emit($event)" [attr.aria-label]="locale.translate('Chapter')">@for (item of book().chapters; track item.number) {<option [value]="item.number">{{ locale.format('Chapter {number}',{number:item.number}) }}</option>}</select><span class="chevron" aria-hidden="true"></span></span></label>
  <div class="verse-picker"><span>{{ locale.translate('Verse') }}</span><button #trigger type="button" class="verse-trigger" [attr.aria-label]="locale.format('Verse {number} of {count}',{number:activeVerse(),count:chapter().verses.length})" aria-haspopup="dialog" [attr.aria-expanded]="expanded()" aria-controls="verse-picker-grid" (click)="toggle()" (keydown.arrowdown)="$event.preventDefault();open()"><bdi>{{ activeVerse().toLocaleString(locale.language) }}<span class="verse-total" aria-hidden="true">{{ chapter().verses.length.toLocaleString(locale.language) }}</span></bdi><span class="chevron" aria-hidden="true"></span></button>
    @if (expanded()) {<div class="verse-popover" role="dialog" [attr.aria-label]="locale.translate('Verse')"><p>{{ locale.format('{count} verses',{count:chapter().verses.length}) }}</p><div #grid id="verse-picker-grid" class="verse-grid" dir="ltr">@for (verse of chapter().verses; track verse.id; let index=$index) {<button type="button" [attr.data-verse]="verse.number" [attr.aria-label]="locale.translate('Verse')+' '+verse.id" [attr.aria-current]="verse.number===activeVerse()?'true':null" (keydown)="move($event,index)" (click)="choose(verse.number)">{{ verse.number.toLocaleString(locale.language) }}</button>}</div></div>}
  </div>
  <div class="reading-position"><span>{{ locale.format('Verse {number} of {count}',{number:activeVerse(),count:chapter().verses.length}) }}</span><progress [value]="activeVerse()" [max]="chapter().verses.length" [attr.aria-label]="locale.format('Verse {number} of {count}',{number:activeVerse(),count:chapter().verses.length})"></progress></div>
</div>
